name: LaunchPane rebrand

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: macos-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply LaunchPane rebrand
        run: python3 .github/scripts/rebrand_launchpane.py

      - name: Verify retired project branding is gone
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'OpenLaunchpad|OPENLAUNCHPAD|openlaunchpad|open-launchpad' -- .; then
            echo 'Retired project branding still exists in tracked text.' >&2
            exit 1
          fi
          if find . -path './.git' -prune -o -print | grep -E 'OpenLaunchpad|OPENLAUNCHPAD|openlaunchpad|open-launchpad'; then
            echo 'Retired project branding still exists in a path.' >&2
            exit 1
          fi
          test -d LaunchPane.xcodeproj
          test -f LaunchPane.xcodeproj/xcshareddata/xcschemes/LaunchPane.xcscheme
          test -d Sources/LaunchPane
          test -d Sources/LaunchPaneAgent

      - name: Validate package manifest
        run: swift package dump-package >/dev/null

      - name: Commit rebrand directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: rebrand project to LaunchPane'
          git push origin HEAD:main
