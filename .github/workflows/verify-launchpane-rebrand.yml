name: Verify LaunchPane rebrand

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Verify Swift package
        run: swift test

      - name: Verify Xcode project
        run: |
          xcodebuild \
            -project LaunchPane.xcodeproj \
            -scheme LaunchPane \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Remove one-shot verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-launchpane-rebrand.yml
          git commit -m 'chore: remove LaunchPane rebrand verifier'
          git push origin HEAD:main
