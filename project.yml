name: LaunchPane
# LAUNCHPANE_XCODE_LEGACY_RESOURCE_CLEANUP_V1

options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  AppCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/AppCore
        excludes:
          - "**/*.before-*"
          - "**/*.backup-*"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.launchpane.AppCore
        GENERATE_INFOPLIST_FILE: YES

  DisplayCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/DisplayCore
        excludes:
          - "**/*.before-*"
          - "**/*.backup-*"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.launchpane.DisplayCore
        GENERATE_INFOPLIST_FILE: YES

  LayoutCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/LayoutCore
        excludes:
          - "**/*.before-*"
          - "**/*.backup-*"
    dependencies:
      - target: DisplayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.launchpane.LayoutCore
        GENERATE_INFOPLIST_FILE: YES

  LaunchPaneAgent:
    type: application
    platform: macOS
    sources:
      - path: Sources/LaunchPane
        excludes:
          - main.swift
          - Resources
          - "**/*.backup-*"
          - "**/*.before-*"
      - path: Sources/LaunchPaneAgent
        excludes:
          - "**/*.backup-*"
          - "**/*.before-*"
    dependencies:
      - target: AppCore
      - target: DisplayCore
      - target: LayoutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.launchpane.LaunchPaneAgent
        PRODUCT_NAME: LaunchPaneAgent
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LaunchPaneAgent
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 LaunchPane contributors
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  LaunchPane:
    type: application
    platform: macOS
    sources:
      - path: Sources/LaunchPane/main.swift
      - path: Sources/LaunchPane/Resources
    dependencies:
      - target: LaunchPaneAgent
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.launchpane.LaunchPane
        PRODUCT_NAME: LaunchPane
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LaunchPane
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 LaunchPane contributors
        CODE_SIGN_STYLE: Automatic

  DisplayCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DisplayCoreTests
        excludes:
          - "**/*.before-*"
          - "**/*.backup-*"
    dependencies:
      - target: DisplayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.launchpane.DisplayCoreTests
        GENERATE_INFOPLIST_FILE: YES

  AppCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppCoreTests
        excludes:
          - "**/*.before-*"
          - "**/*.backup-*"
    dependencies:
      - target: AppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.launchpane.AppCoreTests
        GENERATE_INFOPLIST_FILE: YES

  LayoutCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LayoutCoreTests
        excludes:
          - "**/*.before-*"
          - "**/*.backup-*"
    dependencies:
      - target: DisplayCore
      - target: LayoutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.launchpane.LayoutCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LaunchPane:
    build:
      targets:
        LaunchPane: all
        AppCoreTests: [test]
        DisplayCoreTests: [test]
        LayoutCoreTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - AppCoreTests
        - DisplayCoreTests
        - LayoutCoreTests
