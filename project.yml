name: OpenLaunchpad

options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  AppCore:
    type: framework
    platform: macOS
    sources:
      - Sources/AppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlaunchpad.AppCore
        GENERATE_INFOPLIST_FILE: YES

  DisplayCore:
    type: framework
    platform: macOS
    sources:
      - Sources/DisplayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlaunchpad.DisplayCore
        GENERATE_INFOPLIST_FILE: YES

  LayoutCore:
    type: framework
    platform: macOS
    sources:
      - Sources/LayoutCore
    dependencies:
      - target: DisplayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlaunchpad.LayoutCore
        GENERATE_INFOPLIST_FILE: YES

  OpenLaunchpad:
    type: application
    platform: macOS
    sources:
      - path: Sources/OpenLaunchpad
        excludes:
          - "**/*.backup-*"
    dependencies:
      - target: AppCore
      - target: DisplayCore
      - target: LayoutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlaunchpad.OpenLaunchpad
        PRODUCT_NAME: OpenLaunchpad
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenLaunchpad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 OpenLaunchpad contributors
        CODE_SIGN_STYLE: Automatic

  DisplayCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DisplayCoreTests
    dependencies:
      - target: DisplayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlaunchpad.DisplayCoreTests
        GENERATE_INFOPLIST_FILE: YES

  AppCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AppCoreTests
    dependencies:
      - target: AppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlaunchpad.AppCoreTests
        GENERATE_INFOPLIST_FILE: YES

  LayoutCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LayoutCoreTests
    dependencies:
      - target: DisplayCore
      - target: LayoutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlaunchpad.LayoutCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenLaunchpad:
    build:
      targets:
        OpenLaunchpad: all
        AppCoreTests: [test]
        DisplayCoreTests: [test]
        LayoutCoreTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - AppCoreTests
        - DisplayCoreTests
        - LayoutCoreTests
